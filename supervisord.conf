[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Redis ─────────────────────────────────────────────────────────────────────
; The container runs with --network host, so the host machine's Redis on
; port 6379 is directly reachable. This wrapper checks whether Redis is
; already responding before trying to start a second instance.
; Exit 0  → Redis was already running (host Redis), supervisord won't restart.
; Running → redis-server started here and keeps running.
;
; startsecs=0 is critical here: the "already running" branch of this script
; can exit in well under a second. With the default startsecs=1, supervisor
; would never consider the process "started" before it exits, so the exit
; would be treated as a STARTUP FAILURE (BACKOFF) regardless of exitcodes,
; eventually leading to FATAL. startsecs=0 makes supervisor treat the process
; as started immediately on spawn, so exit code 0 is then correctly evaluated
; against exitcodes/autorestart=unexpected and accepted as a normal exit.
[program:redis]
command=bash -c "redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && echo 'Redis already responding on :6379, skipping internal start' || exec redis-server --port 6379 --daemonize no --save '' --loglevel warning --dir /tmp --protected-mode no"
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
startretries=1
priority=10
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log
stdout_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true

; ── FastAPI backend (uvicorn) ────────────────────────────────────────────────
; Cold start imports ~80 generated modules (hpcl_ceg_model.py is 750 KB) plus
; heavy deps (pandas, polars, weasyprint, elasticsearch, motor, keycloak,
; camunda, python-ldap). This can take well over a minute before uvicorn
; binds :8002. A short startsecs caused supervisord to mark the still-booting
; process as BACKOFF and kill the retries — the recurring "API never comes up"
; failure. startsecs=60 gives it time to finish cold-importing.
[program:api]
command=/opt/venv/bin/python -m urdhva_base
directory=/opt/ceg/algo/api_manager
environment=HOST="0.0.0.0",PORT="8002",MODE="prod",PYTHONPATH="/opt/ceg/algo:/opt/ceg/algo/api_manager",ALG_ENV_PATH="/opt/ceg/algo/api_manager/.alg_env"
autostart=true
autorestart=true
startsecs=60
startretries=10
priority=20
stopwaitsecs=30
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

; ── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
