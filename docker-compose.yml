##############################################################################
# docker-compose.yml — local development / testing
#
# Usage:
#   docker compose up --build
#
# Then open:
#   http://localhost:5378/     — NOVEX frontend
#   http://localhost:5378/docs — Swagger UI (proxied through nginx)
#   http://localhost:8002/docs — FastAPI direct
##############################################################################

services:
  novex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novex_dev
    ports:
      - "5378:5378"      # nginx → frontend + proxied /api and /docs
      - "8002:8002"      # FastAPI direct → /docs, /redoc, /openapi.json
    environment:
      - MODE=prod
    restart: unless-stopped
    healthcheck:
      # Probe the real FastAPI liveness route (via nginx) so "healthy" means
      # backend-up, not merely "nginx serving". Reports the true status.
      test: ["CMD", "curl", "-fsS", "http://localhost:5378/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    volumes:
      # Mount the .alg_env at runtime so secrets are never baked into the image
      - ./backend/api_manager/.alg_env:/opt/ceg/algo/api_manager/.alg_env:ro
      # Persist digital-twin model assets across container restarts
      - /opt/digitaltwin_images:/opt/digitaltwin_images
