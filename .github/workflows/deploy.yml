name: Build and Deploy Application
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.vars.outputs.image_lower }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: vars
        run: echo "image_lower=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.image_lower }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Clean build: the previous image had a corrupted/truncated hpcl_ceg_model.py
          # (module had no Users attribute). Disable GHA cache until the model layer is proven clean.
          no-cache: true

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment: production   # <-- uncomment + set this if DEPLOY_* secrets live under an Environment, not repo-level
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify deploy secrets are present
        run: |
          [ -n "${{ secrets.DEPLOY_HOST }}" ] && echo "DEPLOY_HOST: set" || echo "DEPLOY_HOST: MISSING"
          [ -n "${{ secrets.DEPLOY_USER }}" ] && echo "DEPLOY_USER: set" || echo "DEPLOY_USER: MISSING"
          [ -n "${{ secrets.DEPLOY_PASSWORD }}" ] && echo "DEPLOY_PASSWORD: set" || echo "DEPLOY_PASSWORD: MISSING"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALG_ENV_CONTENTS: ${{ secrets.ALG_ENV_CONTENTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ needs.build-and-push.outputs.image_lower }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          debug: true
          envs: ALG_ENV_CONTENTS,GH_TOKEN,GH_ACTOR,IMAGE
          script: |
            set -e

            echo "${GH_TOKEN}" | sudo docker login ghcr.io \
              -u "${GH_ACTOR}" \
              --password-stdin

            sudo docker pull ${IMAGE}:latest
            sudo docker stop app-container || true
            sudo docker rm app-container || true
            sudo mkdir -p /opt/digitaltwin_images
            sudo mkdir -p /opt/novex/secrets

            echo "${ALG_ENV_CONTENTS}" | sudo tee /opt/novex/secrets/.alg_env > /dev/null
            sudo chmod 600 /opt/novex/secrets/.alg_env

            sudo docker run -d \
              --name app-container \
              --restart unless-stopped \
              -p 5378:5378 \
              -p 8002:8002 \
              -e MODE=prod \
              -v /opt/novex/secrets/.alg_env:/opt/ceg/algo/api_manager/.alg_env:ro \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            echo "Waiting for nginx/frontend to start..."
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Frontend is up (HTTP $STATUS)"
                break
              fi
              echo "Frontend not ready yet (HTTP $STATUS), retrying ($i/10)..."
              sleep 3
              if [ "$i" -eq 10 ]; then
                echo "Frontend failed to start (last HTTP status: $STATUS)."
                sudo docker exec app-container ls -la /usr/share/nginx/html || true
                sudo docker exec app-container nginx -t || true
                sudo docker exec app-container supervisorctl status || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Waiting for FastAPI backend (cold start can take 2+ minutes)..."
            for i in $(seq 1 40); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "API is up (HTTP $STATUS)"
                break
              fi
              echo "API not ready yet (HTTP $STATUS), retrying ($i/40)..."
              sleep 5
              if [ "$i" -eq 40 ]; then
                echo "API failed to start (last HTTP status: $STATUS)."
                sudo docker exec app-container supervisorctl status || true
                sudo docker exec app-container tail -n 150 /var/log/api.log || true
                sudo docker exec app-container tail -n 50 /var/log/nginx_error.log || true
                sudo docker logs app-container
                exit 1
              fi
            done

            echo "Checking Swagger UI (proxied through nginx)…"
            DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/docs || echo "000")
            if [ "$DOCS_STATUS" = "000" ] || [ "$DOCS_STATUS" = "404" ]; then
              echo "Swagger endpoint unreachable or missing (HTTP $DOCS_STATUS)."
              sudo docker exec app-container supervisorctl status || true
              sudo docker exec app-container tail -n 100 /var/log/api.log || true
              sudo docker logs app-container
              exit 1
            else
              echo "Swagger endpoint reachable (HTTP $DOCS_STATUS)"
            fi

            echo "Checking login route registration…"
            # POST with dummy credentials: real route → 401/422/200; missing route → 404; crashing fallback → 503
            LOGIN_ROUTE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5378/api/users/login -H "Content-Type: application/json" -d '{"username":"deploy-check","password":"deploy-check"}' || echo "000")
            echo "Login route responded with HTTP $LOGIN_ROUTE_STATUS"
            # 404 means users_actions.py failed to import during router discovery.
            # 503 means the fallback route is active but crashing (usually hpcl_ceg_model issue).
            # 401/422/200 are acceptable because the route exists and processed the request.
            if [ "$LOGIN_ROUTE_STATUS" = "404" ] || [ "$LOGIN_ROUTE_STATUS" = "503" ]; then
              echo "Login route is missing or crashing (HTTP $LOGIN_ROUTE_STATUS)."
              sudo docker exec app-container supervisorctl status || true
              sudo docker exec app-container tail -n 150 /var/log/api.log || true
              exit 1
            fi

            echo "Checking API proxy…"
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/api/ || echo "000")
            echo "API endpoint responded with HTTP $API_STATUS"

            echo "Checking direct :8002 access…"
            DIRECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/docs || echo "000")
            if [ "$DIRECT_STATUS" != "200" ]; then
              echo "Direct :8002 access failed (HTTP $DIRECT_STATUS)."
              echo "This confirms uvicorn is not bound to 0.0.0.0 — check __main__.py host parameter."
              sudo docker exec app-container supervisorctl status || true
              sudo docker exec app-container tail -n 100 /var/log/api.log || true
              exit 1
            else
              echo "Direct :8002 access OK (HTTP $DIRECT_STATUS)"
            fi

            echo "Checking direct :8002 health…"
            DIRECT_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/api/health || echo "000")
            echo "Direct :8002 health responded with HTTP $DIRECT_HEALTH"

            sudo docker image prune -f
