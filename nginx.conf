server {
    listen 5378;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads (react-dropzone, xlsx imports). nginx defaults to
    # 1 MB which causes HTTP 413 on any real upload.
    client_max_body_size 100m;

    # Health check endpoint — proxies to the REAL backend liveness probe.
    # Returning a static "ok" (old config) reports the container healthy
    # even when FastAPI is down. Now /health reflects actual API health.
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8002/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Serve static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Normalize bare /api → /api/ so it matches the prefix location below
    location = /api {
        return 308 /api/;
    }

    # Proxy API calls to FastAPI backend. NOTE: proxy_pass has NO URI part,
    # so the full original URI (/api/...) is forwarded unchanged. The backend
    # mounts every router under /api, so this is correct.
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Header forwarding (Critical for Auth & Websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensures Bearer / JWT tokens are passed to FastAPI
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # Generous timeouts for long-running API operations
        # (report generation via weasyprint, Excel exports, large queries)
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Preflight OPTIONS Request handling for CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Documentation routes
    location /docs {
        proxy_pass http://127.0.0.1:8002/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8002/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8002/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
